name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  JUCE_VERSION: "8.0.10"

jobs:
  dsp-tests:
    name: Headless DSP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (no JUCE required)
        run: cmake -S . -B build-tests -DCMAKE_BUILD_TYPE=Release -DCS80_BUILD_PLUGIN=OFF -DCS80_BUILD_TOOLS=OFF

      - name: Build
        run: cmake --build build-tests --config Release --parallel 2

      - name: Run tests
        run: ctest --test-dir build-tests -C Release --output-on-failure

  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: macos-14
            label: macos
          - os: windows-latest
            label: windows

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ env.JUCE_VERSION }}-${{ hashFiles('cmake/JUCE.cmake') }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCS80_BUILD_TOOLS=OFF
          -DCS80_BUILD_TESTS=ON

      - name: Build plugin, standalone and tests
        run: cmake --build build --config Release --parallel 2

      - name: Run headless tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package downloads
        shell: bash
        run: |
          REL=build/src/plugin/Cs80Plugin_artefacts/Release
          if [ ! -d "$REL" ]; then
            echo "Artefacts directory not found: $REL"
            find build -maxdepth 6 -name '*.vst3' -o -name '*.component' -o -name 'CS-80E*'
            exit 1
          fi

          # Ship only the installable formats, not the shared static library.
          mkdir -p dist/pkg
          for item in VST3 AU Standalone; do
            if [ -d "$REL/$item" ]; then
              cp -R "$REL/$item" dist/pkg/
            fi
          done
          test -d dist/pkg/VST3 || { echo 'No VST3 bundle packaged'; exit 1; }

          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" -c "import shutil; shutil.make_archive('dist/CS-80E-${{ matrix.label }}', 'zip', 'dist/pkg')"
          ls -lh dist
          "$PY" -c "import zipfile; z=zipfile.ZipFile('dist/CS-80E-${{ matrix.label }}.zip'); print('\n'.join(z.namelist()[:12]))"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: CS-80E-${{ matrix.label }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  screenshots:
    name: Screenshots & demo render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ env.JUCE_VERSION }}-${{ hashFiles('cmake/JUCE.cmake') }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCS80_BUILD_TOOLS=ON
          -DCS80_BUILD_TESTS=OFF

      - name: Build offline renderer
        run: cmake --build build --config Release --target Cs80Screenshots --parallel 2

      - name: Render panel screenshots and demo audio
        run: xvfb-run -a ./build/tools/Cs80Screenshots_artefacts/Release/Cs80Screenshots docs

      - name: Verify renders
        run: |
          python3 - <<'PY'
          import pathlib

          shots = sorted(pathlib.Path("docs/screenshots").glob("*.png"))
          assert len(shots) == 6, f"expected 6 screenshots, found {len(shots)}"

          for shot in shots:
              size = shot.stat().st_size
              assert size > 20_000, f"{shot} looks empty ({size} bytes)"
              with shot.open("rb") as handle:
                  assert handle.read(8) == b"\x89PNG\r\n\x1a\n", f"{shot} is not a PNG"
              print(f"  ok {shot.name:28s} {size:>8,d} bytes")

          audio = pathlib.Path("docs/audio/cs80-demo.wav")
          assert audio.exists() and audio.stat().st_size > 100_000, "demo WAV missing"
          print(f"  ok {audio.name:28s} {audio.stat().st_size:>8,d} bytes")
          PY

      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: CS-80E-previews
          path: |
            docs/screenshots
            docs/audio
          if-no-files-found: error
          retention-days: 30

  pluginval:
    name: VST3 validation (pluginval)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install pluginval dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxext6 libxrandr2 libxinerama1 libxcursor1 \
            libfreetype6 libfontconfig1 libgl1 xvfb unzip
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: CS-80E-linux
          path: artifacts

      - name: Unpack plugin
        run: |
          mkdir -p plugin
          unzip -q artifacts/CS-80E-linux.zip -d plugin
          VST3=$(find plugin -type d -name '*.vst3' | head -1)
          test -n "$VST3" || { echo "No VST3 found"; find plugin -maxdepth 4; exit 1; }
          echo "VST3=$VST3" >> "$GITHUB_ENV"
          find plugin -maxdepth 4 -type f | head -20

      - name: Download pluginval
        run: |
          curl -fsSL -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip -d pluginval-bin
          chmod +x pluginval-bin/pluginval

      - name: Validate
        run: |
          xvfb-run -a ./pluginval-bin/pluginval \
            --strictness-level 5 \
            --validate-in-process \
            --skip-gui-tests \
            "$VST3" 2>&1 | tee pluginval.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CS-80E-pluginval-log
          path: pluginval.log
          if-no-files-found: warn

  release:
    name: Attach builds to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, screenshots, pluginval]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect downloads
        run: |
          mkdir -p release
          find artifacts -name '*.zip' -exec cp {} release/ \;
          (cd artifacts/CS-80E-previews && zip -qr "$GITHUB_WORKSPACE/release/CS-80E-previews.zip" .)
          ls -lh release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: CS-80E ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.zip
