name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  JUCE_VERSION: "8.0.10"

jobs:
  dsp-tests:
    name: Headless DSP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (no JUCE required)
        run: cmake -S . -B build-tests -DCMAKE_BUILD_TYPE=Release -DCS80_BUILD_PLUGIN=OFF -DCS80_BUILD_TOOLS=OFF

      - name: Build
        run: cmake --build build-tests --config Release --parallel 2

      - name: Run tests
        run: ctest --test-dir build-tests -C Release --output-on-failure

  version-check:
    name: Version and tag consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION, CMake and tag agree
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          grep -q "project(CS80E VERSION ${version} " CMakeLists.txt
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            test "v${version}" = "${GITHUB_REF_NAME}"
          fi
          echo "Version ${version} is consistent."

  analysis:
    name: Benchmarks and spectral analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build-analysis
          -DCMAKE_BUILD_TYPE=Release
          -DCS80_BUILD_PLUGIN=OFF
          -DCS80_BUILD_TOOLS=OFF

      - name: Build engine, tests and analysis tool
        run: cmake --build build-analysis --config Release --parallel 2

      - name: Run DSP tests
        run: ctest --test-dir build-analysis -C Release --output-on-failure

      - name: CPU benchmark
        run: ./build-analysis/tools/analysis/cs80_analysis bench | tee benchmark.txt

      - name: Aliasing analysis
        run: ./build-analysis/tools/analysis/cs80_analysis alias | tee aliasing.txt

      - name: Latency analysis
        run: ./build-analysis/tools/analysis/cs80_analysis latency | tee latency.txt

      - name: Upload analysis logs
        uses: actions/upload-artifact@v4
        with:
          name: CS-80E-analysis
          path: |
            benchmark.txt
            aliasing.txt
            latency.txt
          if-no-files-found: error
          retention-days: 30

  sanitizers:
    name: AddressSanitizer + UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure with sanitizers
        run: >
          cmake -S . -B build-san
          -DCMAKE_BUILD_TYPE=Debug
          -DCS80_BUILD_PLUGIN=OFF
          -DCS80_BUILD_TOOLS=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-san --config Debug --parallel 2

      - name: Run tests under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-san -C Debug --output-on-failure

  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ env.JUCE_VERSION }}-${{ hashFiles('cmake/JUCE.cmake') }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCS80_BUILD_TOOLS=OFF
          -DCS80_BUILD_TESTS=ON

      - name: Build plugin, standalone and tests
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2 2>&1 | tee build-output.log

      - name: Publish build failure details
        if: failure()
        shell: bash
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -nE 'error [A-Z]+[0-9]+|fatal error|LNK[0-9]+|MSB[0-9]+|FAILED' build-output.log | head -80 || true
            echo '```'
            echo '### Build log tail'
            echo '```'
            tail -n 80 build-output.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run headless tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package downloads
        shell: bash
        run: |
          REL=build/src/plugin/Cs80Plugin_artefacts/Release
          if [ ! -d "$REL" ]; then
            echo "Artefacts directory not found: $REL"
            find build -maxdepth 6 -name '*.vst3' -o -name '*.component' -o -name 'CS-80E*'
            exit 1
          fi

          # Ship only the installable formats, not the shared static library.
          mkdir -p dist/pkg
          for item in VST3 AU Standalone; do
            if [ -d "$REL/$item" ]; then
              cp -R "$REL/$item" dist/pkg/
            fi
          done
          test -d dist/pkg/VST3 || { echo 'No VST3 bundle packaged'; exit 1; }

          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" -c "import shutil; shutil.make_archive('dist/CS-80E-${{ matrix.label }}', 'zip', 'dist/pkg')"
          ls -lh dist
          "$PY" -c "import zipfile; z=zipfile.ZipFile('dist/CS-80E-${{ matrix.label }}.zip'); print('\\n'.join(z.namelist()[:12]))"

      - name: Validate AU (auval)
        if: runner.os == 'macOS'
        run: |
          AU="dist/pkg/AU/CS-80E.component"
          test -d "$AU" || { echo "AU bundle not packaged"; find dist -maxdepth 5; exit 1; }
          codesign --force --deep --sign - "$AU"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          rm -rf "$HOME/Library/Audio/Plug-Ins/Components/CS-80E.component"
          cp -R "$AU" "$HOME/Library/Audio/Plug-Ins/Components/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          echo "Registered Audio Units:"
          auval -a | grep -i "CS-80E" || true
          auval -v aumu Cs80 Free

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: CS-80E-${{ matrix.label }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  screenshots:
    name: Screenshots & demo render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ env.JUCE_VERSION }}-${{ hashFiles('cmake/JUCE.cmake') }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCS80_BUILD_TOOLS=ON
          -DCS80_BUILD_TESTS=OFF

      - name: Build offline renderer
        run: cmake --build build --config Release --target Cs80Screenshots --parallel 2

      - name: Render panel screenshots and demo audio
        run: xvfb-run -a ./build/tools/Cs80Screenshots_artefacts/Release/Cs80Screenshots docs

      - name: Verify renders
        run: |
          python3 - <<'PY'
          import pathlib

          expected = [
              "01-blade-brass.png", "02-vangelis-lead.png", "03-neon-pads.png",
              "04-preset-library.png", "05-brass-stab.png", "06-filter-closeup.png",
              "07-vca-sine.png", "08-ribbon-keybed.png", "09-blade-runner.png",
              "10-channel-two.png",
          ]

          shots = sorted(pathlib.Path("docs/screenshots").glob("*.png"))
          names = [shot.name for shot in shots]
          assert names == expected, f"expected {expected}, found {names}"

          for shot in shots:
              size = shot.stat().st_size
              assert size > 20_000, f"{shot} looks empty ({size} bytes)"
              with shot.open("rb") as handle:
                  assert handle.read(8) == b"\x89PNG\r\n\x1a\n", f"{shot} is not a PNG"
              print(f"  ok {shot.name:28s} {size:>8,d} bytes")

          audio = pathlib.Path("docs/audio/cs80-demo.wav")
          assert audio.exists() and audio.stat().st_size > 100_000, "demo WAV missing"
          print(f"  ok {audio.name:28s} {audio.stat().st_size:>8,d} bytes")
          PY

      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: CS-80E-previews
          path: |
            docs/screenshots
            docs/audio
          if-no-files-found: error
          retention-days: 30

      - name: Refresh committed renders on main
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots docs/audio
          if git diff --cached --quiet; then
            echo "Renders are unchanged."
          else
            git commit -m "Refresh panel renders and demo [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

  pluginval:
    name: VST3 validation (pluginval)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install pluginval dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-6 libxext6 libxrandr2 libxinerama1 libxcursor1 \
            libfreetype6 libfontconfig1 libgl1 xvfb unzip
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: CS-80E-linux
          path: artifacts

      - name: Unpack plugin
        run: |
          mkdir -p plugin
          unzip -q artifacts/CS-80E-linux.zip -d plugin
          VST3=$(find plugin -type d -name '*.vst3' | head -1)
          test -n "$VST3" || { echo "No VST3 found"; find plugin -maxdepth 4; exit 1; }
          echo "VST3=$VST3" >> "$GITHUB_ENV"
          find plugin -maxdepth 4 -type f | head -20

      - name: Download pluginval
        run: |
          curl -fsSL -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip -d pluginval-bin
          chmod +x pluginval-bin/pluginval

      - name: Validate
        run: |
          xvfb-run -a ./pluginval-bin/pluginval \
            --strictness-level 5 \
            --validate-in-process \
            --skip-gui-tests \
            "$VST3" 2>&1 | tee pluginval.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CS-80E-pluginval-log
          path: pluginval.log
          if-no-files-found: warn

  pluginval-windows:
    name: VST3 validation (Windows, pluginval)
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: CS-80E-windows
          path: artifacts

      - name: Unpack plugin
        shell: pwsh
        run: |
          Expand-Archive -Path artifacts/CS-80E-windows.zip -DestinationPath plugin -Force
          $vst3 = Get-ChildItem -Path plugin -Recurse -Directory -Filter '*.vst3' | Select-Object -First 1
          if (-not $vst3) { throw 'No VST3 bundle found' }
          "VST3=$($vst3.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem -Path $vst3.FullName | Select-Object -First 10

      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip' -OutFile pluginval.zip
          Expand-Archive -Path pluginval.zip -DestinationPath pluginval-bin -Force
          $exe = Get-ChildItem -Path pluginval-bin -Recurse -Filter pluginval.exe | Select-Object -First 1
          if (-not $exe) { throw 'pluginval.exe not found' }
          "PLUGINVAL=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate
        shell: pwsh
        run: |
          & $env:PLUGINVAL --strictness-level 5 --validate-in-process --skip-gui-tests $env:VST3 2>&1 | Tee-Object -FilePath pluginval-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CS-80E-pluginval-windows-log
          path: pluginval-windows.log
          if-no-files-found: warn

  publish-latest:
    name: Refresh latest downloads
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [version-check, dsp-tests, analysis, sanitizers, build, screenshots, pluginval, pluginval-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect downloads and checksums
        run: |
          mkdir -p release
          find artifacts -maxdepth 2 -name '*.zip' -exec cp {} release/ \;
          test -f release/CS-80E-linux.zip
          test -f release/CS-80E-macos.zip
          test -f release/CS-80E-windows.zip
          (cd artifacts/CS-80E-previews && zip -qr "$GITHUB_WORKSPACE/release/CS-80E-previews.zip" .)
          cp artifacts/CS-80E-previews/screenshots/*.png release/
          cp artifacts/CS-80E-previews/audio/*.wav release/
          sha256sum release/*.zip > release/SHA256SUMS.txt
          python3 - <<'PY'
          import json, os, pathlib
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/latest"
          manifest = {
              "project": "CS-80E",
              "version": pathlib.Path("VERSION").read_text().strip(),
              "commit": os.environ["GITHUB_SHA"],
              "builds": {
                  "linux": f"{base}/CS-80E-linux.zip",
                  "macos": f"{base}/CS-80E-macos.zip",
                  "windows": f"{base}/CS-80E-windows.zip",
                  "previews": f"{base}/CS-80E-previews.zip",
                  "checksums": f"{base}/SHA256SUMS.txt",
              },
              "formats": {
                  "linux": ["VST3", "Standalone"],
                  "macos": ["VST3", "AU", "Standalone"],
                  "windows": ["VST3", "Standalone"],
              },
              "screenshots": [
                  f"{base}/01-blade-brass.png",
                  f"{base}/02-vangelis-lead.png",
                  f"{base}/03-neon-pads.png",
                  f"{base}/04-preset-library.png",
                  f"{base}/05-brass-stab.png",
                  f"{base}/06-filter-closeup.png",
                  f"{base}/07-vca-sine.png",
                  f"{base}/08-ribbon-keybed.png",
                  f"{base}/09-blade-runner.png",
                  f"{base}/10-channel-two.png",
              ],
          }
          pathlib.Path("release/latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          ls -lh release

      - name: Publish rolling latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CS-80E latest builds
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            [![CS-80E dual-channel panel](https://github.com/${{ github.repository }}/releases/download/latest/01-blade-brass.png)](https://github.com/${{ github.repository }}/releases/download/latest/CS-80E-previews.zip)

            Automated builds from the latest commit on `main`.

            | Platform | Download | Formats |
            | --- | --- | --- |
            | Linux | [CS-80E-linux.zip](https://github.com/${{ github.repository }}/releases/download/latest/CS-80E-linux.zip) | VST3 + Standalone |
            | macOS | [CS-80E-macos.zip](https://github.com/${{ github.repository }}/releases/download/latest/CS-80E-macos.zip) | VST3 + AU + Standalone |
            | Windows | [CS-80E-windows.zip](https://github.com/${{ github.repository }}/releases/download/latest/CS-80E-windows.zip) | VST3 + Standalone |
            | Renders + demo | [CS-80E-previews.zip](https://github.com/${{ github.repository }}/releases/download/latest/CS-80E-previews.zip) | 10 PNGs + demo WAV |
            | Machine-readable links | [latest.json](https://github.com/${{ github.repository }}/releases/download/latest/latest.json) | JSON |

            Built from `${{ github.sha }}`. Checksums are attached as
            `SHA256SUMS.txt`.
          files: |
            release/*.zip
            release/*.png
            release/*.wav
            release/latest.json
            release/SHA256SUMS.txt

      - name: Point rolling tag at this build and prune stale assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # softprops/action-gh-release reuses an existing tag, so move `latest`
          # onto the commit that produced these binaries. The release's source
          # archives then match the builds instead of an older revision.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
            -f sha="${GITHUB_SHA}" \
            -F force=true

          # The action only uploads; it never deletes. Remove assets that this
          # pipeline no longer produces (for example screenshots renamed in a
          # new release) so the rolling release always matches docs/ exactly.
          expected="CS-80E-linux.zip CS-80E-macos.zip CS-80E-windows.zip CS-80E-previews.zip cs80-demo.wav latest.json SHA256SUMS.txt"
          for shot in 01-blade-brass 02-vangelis-lead 03-neon-pads 04-preset-library \
                      05-brass-stab 06-filter-closeup 07-vca-sine 08-ribbon-keybed \
                      09-blade-runner 10-channel-two; do
            expected="$expected ${shot}.png"
          done

          gh release view latest --json assets --jq '.assets[].name' | while read -r asset; do
            case " ${expected} " in
              *" ${asset} "*) ;;
              *)
                echo "Removing stale release asset: ${asset}"
                gh release delete-asset latest "${asset}" --yes
                ;;
            esac
          done

          echo "Release assets now:"
          gh release view latest --json assets --jq '.assets[].name'

  verify-latest:
    name: Verify rolling release
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: publish-latest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloaded
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh release download latest --dir downloaded --clobber; then
              ok=1
              break
            fi
            sleep $((attempt * 5))
          done
          test "$ok" = 1
          ls -lh downloaded

      - name: Verify release matches the repository
        run: python3 tools/verify_release.py --tag latest --dir downloaded

  release:
    name: Attach builds to tag release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version-check, dsp-tests, analysis, sanitizers, build, screenshots, pluginval, pluginval-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect downloads and checksums
        run: |
          mkdir -p release
          find artifacts -maxdepth 2 -name '*.zip' -exec cp {} release/ \;
          (cd artifacts/CS-80E-previews && zip -qr "$GITHUB_WORKSPACE/release/CS-80E-previews.zip" .)
          cp artifacts/CS-80E-previews/screenshots/*.png release/
          cp artifacts/CS-80E-previews/audio/*.wav release/
          sha256sum release/*.zip > release/SHA256SUMS.txt
          python3 - <<'PY'
          import json, os, pathlib
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['GITHUB_REF_NAME']}"
          manifest = {
              "project": "CS-80E",
              "version": pathlib.Path("VERSION").read_text().strip(),
              "commit": os.environ["GITHUB_SHA"],
              "builds": {
                  "linux": f"{base}/CS-80E-linux.zip",
                  "macos": f"{base}/CS-80E-macos.zip",
                  "windows": f"{base}/CS-80E-windows.zip",
                  "previews": f"{base}/CS-80E-previews.zip",
                  "checksums": f"{base}/SHA256SUMS.txt",
              },
              "formats": {
                  "linux": ["VST3", "Standalone"],
                  "macos": ["VST3", "AU", "Standalone"],
                  "windows": ["VST3", "Standalone"],
              },
              "screenshots": [
                  f"{base}/01-blade-brass.png",
                  f"{base}/02-vangelis-lead.png",
                  f"{base}/03-neon-pads.png",
                  f"{base}/04-preset-library.png",
                  f"{base}/05-brass-stab.png",
                  f"{base}/06-filter-closeup.png",
                  f"{base}/07-vca-sine.png",
                  f"{base}/08-ribbon-keybed.png",
                  f"{base}/09-blade-runner.png",
                  f"{base}/10-channel-two.png",
              ],
          }
          pathlib.Path("release/latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          ls -lh release

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          name: CS-80E ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release/*.zip
            release/*.png
            release/*.wav
            release/SHA256SUMS.txt
            release/latest.json

  verify-tagged-release:
    name: Verify tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloaded
          ok=0
          for attempt in 1 2 3 4 5; do
            if gh release download "$GITHUB_REF_NAME" --dir downloaded --clobber; then
              ok=1
              break
            fi
            sleep $((attempt * 5))
          done
          test "$ok" = 1
          ls -lh downloaded

      - name: Verify release matches the repository
        run: python3 tools/verify_release.py --tag "$GITHUB_REF_NAME" --dir downloaded
